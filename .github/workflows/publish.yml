name: Publish design-system to npm

# Two triggers:
#   1. tag push matching v* → publish all packages at that version
#   2. manual workflow_dispatch → emergency republish without retagging
#
# Why tag-driven rather than push-to-main:
#   The design system advances at a different cadence than the consumer
#   apps. Explicit version bumps via tag let aster-cloud/aster-lang-dev
#   pin to known good versions, not "whatever was on main when CI ran".
#
# Auth: NPM_TOKEN secret with publish access to the @aster-cloud scope on
# https://registry.npmjs.org (the same org that already publishes
# @aster-cloud/aster-lang-ts).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance attestations (publishConfig.provenance: true on
      # glossary/package.json) require OIDC token-write so npm can mint
      # a build attestation from GitHub Actions identity. tokens/ui
      # don't enable provenance yet but giving the job write access
      # here is harmless — it's only used when the package opts in.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        # version read from packageManager in root package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          # Tell setup-node to write an ~/.npmrc pointing at the public
          # registry with NODE_AUTH_TOKEN as the auth source. pnpm picks
          # it up automatically.
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # ★发布前必须过质量门。此前本 workflow 只有 build，没有任何
      #   test / lint / typecheck —— 三个**公开 npm 包**
      #   （@aster-cloud/tokens、ui、glossary）就这么发出去了。
      #
      #   PR 上确实有测试，但它们在 storybook.yml 里，触发条件是
      #   `push: main` / `pull_request` —— **tag push 从不触发**。
      #   而 tag 才是本仓的版本真相源，workflow_dispatch 更是文档明写的
      #   「emergency republish without retagging」。两条发布路径都绕过了测试。
      #
      #   对照 aster-lang-ts/release.yml：publish 有 `needs: ci`，
      #   正确的形态在同 org 已经存在。
      #
      # ★typecheck 必须放在 build 之后：glossary-fmt 依赖
      #   `@aster-cloud/glossary/schema` 的产物，build 前 tsc 会报
      #   TS2307 Cannot find module（实测）。
      - name: Typecheck
        run: pnpm typecheck

      # 浏览器用例与 storybook.yml 保持同一套（含 --with-deps 装系统依赖）。
      # 这一步较慢，但发布是低频操作，用它换「不发未验证的包」是划算的。
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test stories (vitest + chromium)
        working-directory: apps/storybook
        run: pnpm test

      # Publish tokens first because ui depends on it transitively.
      # `--no-git-checks` because tags are the canonical version source,
      # and pnpm otherwise wants a clean working tree we just dirtied
      # with the build output.
      #
      # We swallow "version already published" (E403) so tagging a UI-
      # only bump doesn't force a tokens version bump. Anything else
      # still fails the run.
      - name: Publish @aster-cloud/tokens
        working-directory: packages/tokens
        shell: bash {0}
        run: |
          # No `-e` so a non-zero `pnpm publish` doesn't bail before we
          # get a chance to inspect the failure mode.
          out=$(pnpm publish --no-git-checks --access=public 2>&1)
          status=$?
          echo "$out"
          if [ $status -ne 0 ]; then
            if echo "$out" | grep -q "previously published versions"; then
              echo "tokens@$(node -p "require('./package.json').version") already on registry — skipping"
              exit 0
            fi
            exit $status
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @aster-cloud/ui
        working-directory: packages/ui
        shell: bash {0}
        run: |
          out=$(pnpm publish --no-git-checks --access=public 2>&1)
          status=$?
          echo "$out"
          if [ $status -ne 0 ]; then
            if echo "$out" | grep -q "previously published versions"; then
              echo "ui@$(node -p "require('./package.json').version") already on registry — skipping"
              exit 0
            fi
            exit $status
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @aster-cloud/glossary — single source of truth for cross-locale
      # terminology + the scanner library used by consumer scripts
      # (aster-cloud check-glossary, aster-lang-dev check-locale-parity).
      # Was previously consumed via sibling-checkout path; promoting to
      # an npm dependency removes that CI-time path coupling.
      - name: Publish @aster-cloud/glossary
        working-directory: packages/glossary
        shell: bash {0}
        run: |
          out=$(pnpm publish --no-git-checks --access=public 2>&1)
          status=$?
          echo "$out"
          if [ $status -ne 0 ]; then
            if echo "$out" | grep -q "previously published versions"; then
              echo "glossary@$(node -p "require('./package.json').version") already on registry — skipping"
              exit 0
            fi
            exit $status
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
